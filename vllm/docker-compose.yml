# vLLM on 2x Radeon Pro V620 (gfx1030), tensor parallel over both cards.
#
#   docker compose up -d deepseek-r1          # DeepSeek-R1-Distill-Qwen-14B (default)
#   docker compose --profile mla up -d deepseek-coder-v2-lite   # experimental, MLA
#
# Only run one service at a time: each one takes both GPUs.
# OpenAI-compatible API on http://<host>:8000/v1

x-vllm: &vllm
  image: vllm-navi21:latest
  restart: unless-stopped
  ipc: host
  shm_size: 8g
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - video
    - render
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
  ports:
    - "8000:8000"
  volumes:
    - ${HF_HOME:-./hf-cache}:/root/.cache/huggingface
  environment: &vllm-env
    HF_TOKEN: ${HF_TOKEN:-}
    # torch.compile hangs on gfx1030; use breakable CUDA graphs instead.
    # If that still hangs, add --enforce-eager to the command.
    VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
    HIP_FORCE_DEV_KERNARG: "1"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TOKENIZERS_PARALLELISM: "false"

services:
  # Dense Qwen2-architecture distill: standard attention, the safe choice on RDNA2.
  # fp16 weights ~30 GB, split over 2x 32 GB -> plenty left for KV cache.
  deepseek-r1:
    <<: *vllm
    command:
      - deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
      - --served-model-name=deepseek-r1
      - --tensor-parallel-size=2
      - --dtype=float16
      # TRITON_ATTN exceeds the 64 KB LDS-per-workgroup limit of RDNA2
      - --attention-backend=ROCM_ATTN
      - --kv-cache-dtype=fp8
      - --max-model-len=32768
      - --max-num-seqs=8
      - --gpu-memory-utilization=0.90
      - --enable-chunked-prefill
      - --reasoning-parser=deepseek_r1

  # Real DeepSeek architecture (MoE + MLA). EXPERIMENTAL on gfx1030: the ROCm MLA
  # fast path (AITER) is Instinct-only, so vLLM falls back to the Triton MLA
  # backend, which is not tested on RDNA2. fp16 weights ~32 GB over 2 cards.
  deepseek-coder-v2-lite:
    <<: *vllm
    profiles: [mla]
    command:
      - deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct
      - --served-model-name=deepseek-coder-v2-lite
      - --tensor-parallel-size=2
      - --dtype=float16
      - --max-model-len=16384
      - --max-num-seqs=4
      - --gpu-memory-utilization=0.92
      - --trust-remote-code
      - --enforce-eager
